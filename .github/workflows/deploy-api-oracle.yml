name: Deploy Airport API to Oracle Compute VM

on:
  push:
    branches:
      - master
    paths:
      - 'Airport.Web/**'
      - 'Airport.Domain/**'
      - 'Airport.Services/**'
      - 'Airport.Persistence/**'
      - 'Airport.Models/**'
      - 'Airport.Contracts/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-api-oracle.yml'
  workflow_dispatch:

env:
  API_SERVICE_NAME: airport-api
  API_INTERNAL_PORT: 8080

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: dotnet test --verbosity normal

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ARM64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            -t ${{ env.API_SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.API_SERVICE_NAME }}:latest \
            --load \
            .

      - name: Deploy to Oracle VM via SSH
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          MONGODB_CONN: ${{ secrets.MONGODB_CONNECTION_STRING }}
          # Pull in new secrets
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_EXPIRY: ${{ secrets.JWT_EXPIRY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Create SSH key file
          mkdir -p ~/.ssh
          echo "$ORACLE_VM_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          # Add host to known_hosts
          ssh-keyscan -H $ORACLE_VM_HOST >> ~/.ssh/known_hosts

          # Copy docker image to VM (docker/podman will load it)
          docker save ${{ env.API_SERVICE_NAME }}:${{ github.sha }} | \
            ssh -i ~/.ssh/oracle_key $ORACLE_VM_USER@$ORACLE_VM_HOST docker load

          # Deploy container on VM - pass connection string as SSH environment variable
          ssh -i ~/.ssh/oracle_key $ORACLE_VM_USER@$ORACLE_VM_HOST bash << ENDSSH

          # Stop and remove old container
          docker stop airport-api 2>/dev/null || true
          docker rm airport-api 2>/dev/null || true

          # Run new container with environment variables
          docker run -d \
            --name airport-api \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            -e "AirportDbConfiguration__ConnectionString=${MONGODB_CONN}" \
            -e "ASPNETCORE_ENVIRONMENT=Production" \
            -e "ASPNETCORE_URLS=http://0.0.0.0:8080" \
            -e "JwtSettings__Issuer=${JWT_ISSUER}" \
            -e "JwtSettings__Audience=${JWT_AUDIENCE}" \
            -e "JwtSettings__Key=${JWT_KEY}" \
            -e "JwtSettings__ExpiryMinutes=${JWT_EXPIRY}" \
            -e 'LoginCredentials__Username=${ADMIN_USERNAME}' \
            -e 'LoginCredentials__Password=${ADMIN_PASSWORD}' \
            ${{ env.API_SERVICE_NAME }}:${{ github.sha }}

          # Wait for container startup
          sleep 3

          # Verify container status is actually 'running' (not restarting or exited)
          STATUS=\$(docker inspect --format='{{.State.Status}}' airport-api 2>/dev/null || echo "not_found")
          if [ "\$STATUS" = "running" ]; then
            echo "API container started successfully (Status: \$STATUS)"
            docker logs --tail 20 airport-api
          else
            echo "API container failed to start! Current status: \$STATUS"
            docker logs airport-api
            exit 1
          fi

          # Clean up old images (keep last 3)
          docker image prune -a -f --filter "until=72h" || true

          echo "API deployed successfully"
          ENDSSH

      - name: Health check
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
        run: |
          sleep 10
          ssh -i ~/.ssh/oracle_key $ORACLE_VM_USER@$ORACLE_VM_HOST << 'ENDSSH'
          echo "Testing API health..."
          if curl -f -s http://localhost:8080/health >/dev/null 2>&1 || \
             curl -f -s http://localhost:8080 >/dev/null 2>&1; then
            echo "API is responding on internal port 8080"
          else
            echo "API health check inconclusive (this might be normal if no health endpoint exists)"
          fi
          docker ps --filter "name=airport-api" --format "{{.Status}}"
          ENDSSH

      - name: Notify deployment
        run: |
          echo "API successfully deployed to Oracle Compute VM"
          echo "Image: ${{ env.API_SERVICE_NAME }}:${{ github.sha }}"
          echo "Access via: https://${{ secrets.ORACLE_VM_HOST }}"
          echo "API runs on HTTP:8080 internally, Caddy handles HTTPS:443 externally"